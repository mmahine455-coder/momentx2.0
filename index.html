function tr(n){if(lang!='en')return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let x;while(x=w.nextNode()){if(x.parentNode.closest('.txt,.mg,b.lk'))continue;const v=trs(x.nodeValue);if(v!=x.nodeValue)x.nodeValue=v}n.querySelectorAll&&n.querySelectorAll('[placeholder]').forEach(e=>{const v=trs(e.placeholder);if(v!=e.placeholder)e.placeholder=v})}
